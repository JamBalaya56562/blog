<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17456f"></stop><stop offset="1" stop-color="#0c2a48"></stop></linearGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="rgba(180,225,255,0.07)" stroke-width="1"></path></pattern>
<marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5cc0ff"></path></marker>
<marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#35e0bd"></path></marker>
<marker id="aY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffb04a"></path></marker>
<marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff7b6a"></path></marker>
</defs>
<rect width="1200" height="700" fill="url(#bg)"></rect><rect width="1200" height="700" fill="url(#grid)"></rect>
<rect x="0" y="0" width="1200" height="96" fill="#092039"></rect>
<rect x="0" y="0" width="14" height="96" fill="#ffb04a"></rect>
<text x="40" y="44" font-size="15" fill="#5cc0ff" letter-spacing="4">containers &amp; docker</text>
<text x="40" y="78" font-size="32" fill="#eef6fc" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif" font-weight="700">ビルド用と実行用で、イメージを分ける</text>
<text x="1168" y="44" font-size="15" fill="rgba(169,198,221,0.8)" text-anchor="end">build in one stage, ship another</text>
<rect x="0" y="96" width="1200" height="3" fill="#5cc0ff"></rect>
<rect x="16" y="112" width="312" height="300" rx="5" fill="#0a2542" stroke="#5cc0ff" stroke-width="1.5"></rect>
<rect x="16" y="112" width="312" height="46" rx="5" fill="#5cc0ff"></rect>
<text x="40" y="143" font-size="22" fill="#062033" font-weight="700">1. base</text>
<text x="40" y="200" font-size="20" fill="#eef6fc">FROM node:22-slim</text>
<text x="40" y="248" font-size="17" fill="#9fd4ff">corepack enable</text>
<text x="40" y="288" font-size="17" fill="#a9c6dd" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">pnpm を使えるようにする</text>
<text x="40" y="340" font-size="16" fill="rgba(169,198,221,0.75)" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">土台。ここは滅多に変わらない</text>
<text x="40" y="376" font-size="16" fill="#5cc0ff" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">次のステージの土台になる</text>
<path d="M332 262H352" stroke="#5cc0ff" stroke-width="2" marker-end="url(#aB)"></path>
<rect x="356" y="112" width="312" height="300" rx="5" fill="#0a2542" stroke="#5cc0ff" stroke-width="1.5"></rect>
<rect x="356" y="112" width="312" height="46" rx="5" fill="#5cc0ff"></rect>
<text x="380" y="143" font-size="22" fill="#062033" font-weight="700">2. deps</text>
<text x="380" y="200" font-size="20" fill="#eef6fc">RUN pnpm install</text>
<text x="380" y="248" font-size="17" fill="#9fd4ff">COPY pnpm-lock.yaml</text>
<text x="380" y="288" font-size="17" fill="#a9c6dd" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">node_modules が乗る</text>
<text x="380" y="340" font-size="16" fill="rgba(169,198,221,0.75)" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">lockfile が同じなら CACHED</text>
<text x="380" y="376" font-size="16" fill="#5cc0ff" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">次のステージの土台になる</text>
<path d="M672 262H692" stroke="#5cc0ff" stroke-width="2" marker-end="url(#aB)"></path>
<rect x="696" y="112" width="312" height="300" rx="5" fill="#0a2542" stroke="#ffb04a" stroke-width="1.5"></rect>
<rect x="696" y="112" width="312" height="46" rx="5" fill="#ffb04a"></rect>
<text x="720" y="143" font-size="22" fill="#062033" font-weight="700">3. build</text>
<text x="720" y="200" font-size="20" fill="#eef6fc">RUN pnpm build</text>
<text x="720" y="248" font-size="17" fill="#9fd4ff">COPY . .</text>
<text x="720" y="288" font-size="17" fill="#a9c6dd" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">dist と /deploy ができる</text>
<text x="720" y="340" font-size="16" fill="rgba(169,198,221,0.75)" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">python3 / g++ も同居して重い</text>
<text x="720" y="376" font-size="16" fill="#ff7b6a" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">最終イメージには残らない</text>
<rect x="16" y="432" width="1168" height="2" fill="rgba(140,205,255,0.25)"></rect>
<rect x="16" y="456" width="700" height="96" rx="5" fill="rgba(255,123,106,0.14)" stroke="#ff7b6a" stroke-width="1.5"></rect>
<text x="40" y="494" font-size="24" fill="#ff7b6a" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif" font-weight="700">1〜3 は捨てる</text>
<text x="40" y="528" font-size="18" fill="#eef6fc" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">node_modules、ビルドツール、ソース。全部置いていく</text>
<path d="M852 414V562" stroke="#ffb04a" stroke-width="3" marker-end="url(#aY)"></path>
<text x="884" y="492" font-size="18" fill="#ffb04a">COPY --from=build /deploy .</text>
<text x="884" y="522" font-size="17" fill="#a9c6dd" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">この 1 行だけが次のステージへ渡る</text>
<rect x="16" y="576" width="1168" height="108" rx="5" fill="#0a2542" stroke="#35e0bd" stroke-width="1.5"></rect>
<rect x="16" y="576" width="1168" height="46" rx="5" fill="#35e0bd"></rect>
<text x="40" y="607" font-size="22" fill="#062b25" font-weight="700">4. runtime — これが emdash:latest</text>
<text x="40" y="660" font-size="20" fill="#eef6fc">FROM node:22-slim<tspan fill="#a9c6dd"> + /deploy + data/ + uploads/</tspan></text>
<text x="1160" y="660" font-size="18" fill="#35e0bd" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif" text-anchor="end" font-weight="700">運ぶのは成果物だけ</text>
</svg>