<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f3350"></stop><stop offset="0.56" stop-color="#0a2036"></stop><stop offset="1" stop-color="#06111c"></stop></linearGradient>
<radialGradient id="gC" cx="0.08" cy="0.04" r="0.72"><stop offset="0" stop-color="#4ac3ff" stop-opacity="0.16"></stop><stop offset="1" stop-color="#4ac3ff" stop-opacity="0"></stop></radialGradient>
<radialGradient id="gT" cx="0.94" cy="0.96" r="0.72"><stop offset="0" stop-color="#2ee6c5" stop-opacity="0.12"></stop><stop offset="1" stop-color="#2ee6c5" stop-opacity="0"></stop></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(150,220,255,0.055)" stroke-width="1"></path></pattern>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff7a6b"></path></marker>
</defs>
<rect width="1200" height="720" fill="url(#bg)"></rect><rect width="1200" height="720" fill="url(#grid)"></rect>
<rect width="1200" height="720" fill="url(#gC)"></rect><rect width="1200" height="720" fill="url(#gT)"></rect>
<g fill="none"><rect x="28" y="28" width="1144" height="664" rx="10" stroke="rgba(120,200,255,0.22)"></rect><rect x="40" y="40" width="1120" height="640" rx="6" stroke="rgba(120,200,255,0.10)"></rect></g>
<rect x="56" y="50" width="10" height="10" fill="#4ac3ff"></rect>
<text x="78" y="60" font-size="15" fill="#4ac3ff" letter-spacing="4">containers &amp; docker</text>
<text x="72" y="112" font-size="30" fill="#e6f1f8" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif" font-weight="700">docker run の 1 行の読み方</text>
<text x="72" y="150" font-size="27" fill="#e6f1f8">How to read a docker run line</text>
<path d="M72 170H1128" stroke="rgba(120,200,255,0.18)"></path><rect x="72" y="204" width="1056" height="132" rx="6" fill="rgba(4,14,24,0.6)" stroke="rgba(74,195,255,0.28)" stroke-width="1"></rect><text x="100" y="256" font-size="22" xml:space="preserve"><tspan fill="rgba(230,241,248,0.58)">$ </tspan><tspan fill="#e6f1f8">docker run</tspan><tspan fill="#2ee6c5"> -d</tspan><tspan fill="#4ac3ff"> --name db</tspan><tspan fill="#ffb84d"> -e POSTGRES_PASSWORD=secret</tspan></text><text x="100" y="300" font-size="22" xml:space="preserve"><tspan fill="#ff7a6b">  -p 5432:5432</tspan><tspan fill="#b7a6ff"> -v pgdata:/var/lib/postgresql</tspan><tspan fill="#4ac3ff" font-weight="700"> postgres:18-alpine</tspan></text><rect x="72" y="380" width="240" height="44" rx="3" fill="#2ee6c5"></rect><text x="192" y="409" font-size="20" fill="#04121c" text-anchor="middle" font-weight="700">-d</text><text x="328" y="400" font-size="19" fill="#e6f1f8" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">裏で動かす</text><text x="328" y="424" font-size="16" fill="rgba(230,241,248,0.58)">run in the background</text><rect x="72" y="464" width="240" height="44" rx="3" fill="#4ac3ff"></rect><text x="192" y="493" font-size="20" fill="#04121c" text-anchor="middle" font-weight="700">--name</text><text x="328" y="484" font-size="19" fill="#e6f1f8" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">コンテナの名前</text><text x="328" y="508" font-size="16" fill="rgba(230,241,248,0.58)">the container's name</text><rect x="72" y="548" width="240" height="44" rx="3" fill="#ffb84d"></rect><text x="192" y="577" font-size="20" fill="#04121c" text-anchor="middle" font-weight="700">-e</text><text x="328" y="568" font-size="19" fill="#e6f1f8" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">中の環境変数</text><text x="328" y="592" font-size="16" fill="rgba(230,241,248,0.58)">an environment variable inside</text><rect x="620" y="380" width="240" height="44" rx="3" fill="#ff7a6b"></rect><text x="740" y="409" font-size="20" fill="#04121c" text-anchor="middle" font-weight="700">-p</text><text x="876" y="400" font-size="19" fill="#e6f1f8" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">ホストの port : コンテナの port</text><text x="876" y="424" font-size="16" fill="rgba(230,241,248,0.58)">host port : container port</text><rect x="620" y="464" width="240" height="44" rx="3" fill="#b7a6ff"></rect><text x="740" y="493" font-size="20" fill="#04121c" text-anchor="middle" font-weight="700">-v</text><text x="876" y="484" font-size="19" fill="#e6f1f8" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">ボリューム名 : 中のパス</text><text x="876" y="508" font-size="16" fill="rgba(230,241,248,0.58)">volume name : path inside</text><rect x="620" y="548" width="240" height="44" rx="3" fill="#4ac3ff"></rect><text x="740" y="575.95" font-size="17" fill="#04121c" text-anchor="middle" font-weight="700">postgres:18-alpine</text><text x="876" y="568" font-size="19" fill="#e6f1f8" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">起こすイメージ : タグ</text><text x="876" y="592" font-size="16" fill="rgba(230,241,248,0.58)">the image:tag to start</text><text x="72" y="662" font-size="21" fill="rgba(230,241,248,0.58)" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">イメージ名より後ろに書いたものは、イメージの既定のコマンドの代わりに実行される</text><text x="72" y="692" font-size="19" fill="rgba(230,241,248,0.40)">anything after the image name runs instead of the default command</text>
</svg>