<text x="68" y="244" font-size="25" fill="#eef6fc">COPY pnpm-lock.yaml ./</text>
<text x="68" y="270" font-size="17" fill="#a9c6dd" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">lockfile。たまにしか変わらない</text>
