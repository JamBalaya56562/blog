<text x="72" y="150" font-size="27" fill="#e6f1f8">Remove the container; the volume stays</text>
<path d="M72 170H1128" stroke="rgba(120,200,255,0.18)"></path><path d="M872 348v208a62 20 0 0 0 124 0V348" fill="rgba(183,166,255,0.14)" stroke="#b7a6ff" stroke-width="2"></path><ellipse cx="934" cy="348" rx="62" ry="20" fill="rgba(183,166,255,0.24)" stroke="#b7a6ff" stroke-width="2"></ellipse><text x="934" y="300" font-size="17" fill="rgba(183,166,255,0.75)" text-anchor="middle" letter-spacing="3">volume</text><text x="934" y="466" font-size="22" fill="#b7a6ff" text-anchor="middle" font-weight="700">pgdata</text><text x="934" y="626" font-size="18" fill="rgba(230,241,248,0.58)" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif" text-anchor="middle">ボリュームは残り続ける</text><text x="934" y="652" font-size="16" fill="rgba(230,241,248,0.4)" text-anchor="middle">the volume stays</text><rect x="96" y="206" width="420" height="124" rx="6" fill="rgba(230,241,248,0.05)" stroke="rgba(230,241,248,0.28)" stroke-width="1"></rect><rect x="104" y="214" width="404" height="32" rx="3" fill="rgba(46,230,197,0.2)"></rect><text x="306" y="235.6" font-size="16" fill="#2ee6c5" text-anchor="middle">writable layer</text><text x="116" y="288" font-size="21" fill="#e6f1f8" font-weight="700">container db</text><text x="116" y="314" font-size="17" fill="rgba(230,241,248,0.58)">/var/lib/postgresql</text><path d="M524 268C660 268 720 400 866 400" fill="none" stroke="#b7a6ff" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#aL)"></path><text x="548" y="236" font-size="18" fill="rgba(230,241,248,0.58)" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">繋いでいる状態</text><text x="548" y="258" font-size="16" fill="rgba(230,241,248,0.4)">attached</text><rect x="96" y="378" width="420" height="124" rx="6" fill="rgba(230,241,248,0.05)" stroke="rgba(230,241,248,0.28)" stroke-width="1"></rect><rect x="104" y="386" width="404" height="32" rx="3" fill="rgba(46,230,197,0.2)"></rect><text x="306" y="407.6" font-size="16" fill="#2ee6c5" text-anchor="middle">writable layer</text><text x="116" y="460" font-size="21" fill="#e6f1f8" font-weight="700">container db</text><text x="116" y="486" font-size="17" fill="rgba(230,241,248,0.58)">/var/lib/postgresql</text><path d="M96 378L516 502M516 378L96 502" stroke="#ff7a6b" stroke-width="4"></path><text x="548" y="434" font-size="20" fill="#ff7a6b">docker rm -f db</text><text x="548" y="462" font-size="17" fill="rgba(230,241,248,0.58)" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">書き込み層は消える</text><rect x="96" y="550" width="420" height="124" rx="6" fill="rgba(230,241,248,0.05)" stroke="rgba(230,241,248,0.28)" stroke-width="1"></rect><rect x="104" y="558" width="404" height="32" rx="3" fill="rgba(46,230,197,0.2)"></rect><text x="306" y="579.6" font-size="16" fill="#2ee6c5" text-anchor="middle">writable layer</text><text x="116" y="632" font-size="21" fill="#e6f1f8" font-weight="700">container db2</text><text x="116" y="658" font-size="17" fill="rgba(230,241,248,0.58)">/var/lib/postgresql</text><path d="M524 612C660 612 720 520 866 520" fill="none" stroke="#b7a6ff" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#aL)"></path><text x="548" y="580" font-size="18" fill="rgba(230,241,248,0.58)" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">同じボリュームに繋ぎ直す</text><text x="548" y="602" font-size="16" fill="rgba(230,241,248,0.4)">re-attached</text><text x="548" y="714" font-size="18" fill="#2ee6c5" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">notes テーブルはそのまま / the table is still there</text><text x="72" y="742" font-size="21" fill="rgba(230,241,248,0.58)" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">コンテナの中に書いたものはコンテナと一緒に消える。ボリュームに書いたものは残る</text><text x="72" y="772" font-size="19" fill="rgba(230,241,248,0.40)">what is written inside the container goes with it; what is written to a volume stays</text>
