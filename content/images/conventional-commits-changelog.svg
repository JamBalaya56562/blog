<g fill="none"><rect x="28" y="28" width="1144" height="564" rx="10" stroke="rgba(120,220,180,0.22)"></rect><rect x="40" y="40" width="1120" height="540" rx="6" stroke="rgba(120,220,180,0.10)"></rect></g>
<rect x="56" y="50" width="10" height="10" fill="#4ade80"></rect>
<text x="78" y="60" font-size="15" fill="#4ade80" letter-spacing="4">conventional commits</text>
<text x="72" y="112" font-size="30" fill="#e8f4f1" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif" font-weight="700">揃った履歴から、CHANGELOG と次のバージョンが出てくる</text>
<text x="72" y="148" font-size="30" fill="#e8f4f1">A tidy history produces the changelog</text>
<path d="M72 164H1128" stroke="rgba(120,220,180,0.18)"></path><text x="72" y="196" font-size="17" fill="#7be4ff">git log --oneline</text><rect x="72" y="214" width="392" height="196" rx="6" fill="rgba(123,228,255,0.05)" stroke="rgba(123,228,255,0.3)"></rect><text x="94" y="252" font-size="16" xml:space="preserve"><tspan fill="#ff6b6b">fix</tspan><tspan fill="#e8f4f1">(api): return 404 for an id</tspan></text><text x="94" y="284" font-size="16" xml:space="preserve"><tspan fill="#4ade80">feat</tspan><tspan fill="#e8f4f1">(api): add a search endpoint</tspan></text><text x="94" y="316" font-size="16" xml:space="preserve"><tspan fill="#4ade80">feat</tspan><tspan fill="#e8f4f1">(api)!: drop the v1 endpoints</tspan></text><text x="94" y="348" font-size="16" xml:space="preserve"><tspan fill="#c4b5fd">build</tspan><tspan fill="#e8f4f1">(git): add lefthook</tspan></text><text x="94" y="380" font-size="16" xml:space="preserve"><tspan fill="rgba(232,244,241,0.38)">chore</tspan><tspan fill="#e8f4f1">: initial commit</tspan></text><path d="M492 300H584" stroke="#ffb84d" stroke-width="2" marker-end="url(#aA)"></path><text x="538" y="282" font-size="17" fill="#ffb84d" text-anchor="middle">git cliff</text><text x="538" y="328" font-size="16" fill="rgba(232,244,241,0.55)" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif" text-anchor="middle">履歴を読む</text><text x="538" y="350" font-size="16" fill="rgba(232,244,241,0.55)" text-anchor="middle">reads the log</text><text x="624" y="196" font-size="17" fill="#4ade80">git cliff --unreleased</text><rect x="624" y="214" width="504" height="280" rx="6" fill="rgba(74,222,128,0.05)" stroke="rgba(74,222,128,0.3)"></rect><text x="648" y="248" font-size="16" fill="rgba(232,244,241,0.38)">## [unreleased]</text><circle cx="654" cy="281" r="5" fill="#4ade80"></circle><text x="670" y="287" font-size="18" fill="#4ade80" font-weight="700">Features</text><text x="670" y="316" font-size="15" fill="#e8f4f1">- *(api)* Add a search endpoint</text><text x="670" y="342" font-size="15" fill="#e8f4f1">- *(api)* [**breaking**] Drop the v1 endpoints</text><circle cx="654" cy="375" r="5" fill="#ff6b6b"></circle><text x="670" y="381" font-size="18" fill="#ff6b6b" font-weight="700">Bug Fixes</text><text x="670" y="410" font-size="15" fill="#e8f4f1">- *(api)* Return 404 for an id</text><path d="M648 440H1104" stroke="rgba(74,222,128,0.22)"></path><text x="648" y="472" font-size="16" fill="rgba(232,244,241,0.55)" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">type が見出しに、scope が先頭に付く</text><text x="72" y="546" font-size="19" fill="#e8f4f1" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">書いたのはコミットメッセージだけ</text><text x="72" y="574" font-size="19" fill="rgba(232,244,241,0.55)">you only ever wrote commit messages</text><rect x="760" y="526" width="368" height="60" rx="6" fill="rgba(255,184,77,0.08)" stroke="rgba(255,184,77,0.45)"></rect><text x="784" y="564" font-size="17" fill="rgba(232,244,241,0.55)">--bumped-version</text><text x="1104" y="564" font-size="26" fill="#ffb84d" text-anchor="end" font-weight="700">v1.3.0</text></svg>