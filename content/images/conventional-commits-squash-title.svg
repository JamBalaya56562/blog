<text x="72" y="148" font-size="30" fill="#e8f4f1">With squash merge, the PR title becomes the commit</text>
<path d="M72 164H1128" stroke="rgba(120,220,180,0.18)"></path><text x="96" y="196" font-size="17" fill="#7be4ff">pull request</text><rect x="72" y="214" width="440" height="250" rx="8" fill="rgba(123,228,255,0.05)" stroke="rgba(123,228,255,0.35)"></rect><text x="96" y="244" font-size="14" fill="#7be4ff" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">PR タイトル / the PR title</text><rect x="96" y="254" width="392" height="46" rx="4" fill="rgba(123,228,255,0.14)" stroke="rgba(123,228,255,0.5)"></rect><text x="116" y="283" font-size="18" fill="#e8f4f1">feat(blog): add dark mode</text><text x="96" y="336" font-size="14" fill="rgba(232,244,241,0.38)" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">コミット / the commits</text><text x="116" y="366" font-size="15" xml:space="preserve"><tspan fill="#4ade80">feat</tspan><tspan fill="rgba(232,244,241,0.55)">(blog): draft the toggle</tspan></text><text x="116" y="396" font-size="15" xml:space="preserve"><tspan fill="#ff6b6b">fix</tspan><tspan fill="rgba(232,244,241,0.55)">(blog): keep the icon aligned</tspan></text><text x="116" y="426" font-size="15" xml:space="preserve"><tspan fill="#c4b5fd">test</tspan><tspan fill="rgba(232,244,241,0.55)">(blog): cover the toggle</tspan></text><path d="M540 330H640" stroke="#ffb84d" stroke-width="2" marker-end="url(#aA)"></path><text x="590" y="308" font-size="17" fill="#ffb84d" text-anchor="middle">squash merge</text><text x="668" y="196" font-size="17" fill="#4ade80">main</text><rect x="668" y="214" width="460" height="250" rx="8" fill="rgba(74,222,128,0.05)" stroke="rgba(74,222,128,0.35)"></rect><text x="692" y="244" font-size="14" fill="#4ade80" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">main に入るコミット / the commit on main</text><rect x="692" y="254" width="412" height="46" rx="4" fill="#4ade80"></rect><text x="712" y="283" font-size="18" fill="#06281a" font-weight="700">feat(blog): add dark mode</text><text x="692" y="344" font-size="18" fill="#e8f4f1" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">3 つのコミットは 1 つに畳まれる</text><text x="692" y="370" font-size="18" fill="rgba(232,244,241,0.55)">the three commits are folded into one</text><text x="692" y="410" font-size="16" fill="#ffb84d" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">だから PR タイトルも commitlint に通す</text><text x="692" y="434" font-size="16" fill="#ffb84d">so the title is checked too</text></svg>