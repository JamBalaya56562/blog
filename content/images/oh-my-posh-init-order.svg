<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Menlo, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c2749"></stop><stop offset="0.55" stop-color="#121a31"></stop><stop offset="1" stop-color="#0d1322"></stop></linearGradient>
    <radialGradient id="warm" cx="0.88" cy="0.06" r="0.6"><stop offset="0" stop-color="#ffb84d" stop-opacity="0.16"></stop><stop offset="1" stop-color="#ffb84d" stop-opacity="0"></stop></radialGradient>
    <radialGradient id="cool" cx="0.05" cy="0.95" r="0.6"><stop offset="0" stop-color="#7be4ff" stop-opacity="0.14"></stop><stop offset="1" stop-color="#7be4ff" stop-opacity="0"></stop></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(150,190,255,0.06)" stroke-width="1"></path></pattern>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="rgba(123,228,255,0.16)"></stop><stop offset="1" stop-color="rgba(123,228,255,0.04)"></stop></linearGradient>
    <linearGradient id="chipA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="rgba(255,184,77,0.18)"></stop><stop offset="1" stop-color="rgba(255,184,77,0.04)"></stop></linearGradient>
    <linearGradient id="chipR" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="rgba(255,107,139,0.18)"></stop><stop offset="1" stop-color="rgba(255,107,139,0.04)"></stop></linearGradient>
    <filter id="glow" x="-30%" y="-200%" width="160%" height="500%"><feGaussianBlur stdDeviation="3.5"></feGaussianBlur></filter>
  </defs>
  <rect width="1200" height="560" fill="url(#bg)"></rect>
  <rect width="1200" height="560" fill="url(#grid)"></rect>
  <rect width="1200" height="560" fill="url(#warm)"></rect>
  <rect width="1200" height="560" fill="url(#cool)"></rect>
  <g fill="none"><rect x="28" y="28" width="1144" height="504" rx="10" stroke="rgba(160,200,255,0.22)"></rect><rect x="40" y="40" width="1120" height="480" rx="6" stroke="rgba(160,200,255,0.10)"></rect></g>
  <rect x="56" y="50" width="10" height="10" fill="#ffb84d"></rect>
  <text x="78" y="60" font-size="15" letter-spacing="4" fill="#ffb84d">oh-my-posh</text>
  <text x="72" y="112" font-size="30" fill="#eaf2ff" font-family="'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', system-ui, sans-serif" font-weight="700">$PROFILE の読み込み順 — prompt を最後に握るのはどちらか</text>
  <text x="72" y="148" font-size="30" fill="#eaf2ff">$PROFILE: who owns `prompt`</text>
  <path d="M72 166H1128" stroke="rgba(160,200,255,0.16)"></path>

  <text x="72" y="206" font-size="22" fill="#9dff7b" letter-spacing="2" font-family="'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', system-ui, sans-serif">動く順</text>
  <text x="164" y="206" font-size="18" fill="#eaf2ff" font-family="'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', system-ui, sans-serif">init が先、activate が後</text>
  <text x="72" y="232" font-size="18" fill="#eaf2ff">init first, activate second</text>

  <rect x="72" y="248" width="460" height="72" rx="6" fill="url(#chip)" stroke="#7be4ff" stroke-width="1.5"></rect>
  <text x="94" y="282" font-size="17" fill="#eaf2ff">1</text>
  <text x="118" y="282" font-size="21" fill="#eaf2ff">oh-my-posh init pwsh</text>
  <text x="118" y="308" font-size="16" fill="#7be4ff" font-family="'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', system-ui, sans-serif">prompt を握る / owns the prompt</text>
  <path d="M302 320V344" stroke="#7be4ff" stroke-width="3" fill="none"></path><path d="M296 344l6 12 6-12z" fill="#7be4ff"></path>

  <rect x="72" y="358" width="460" height="72" rx="6" fill="url(#chip)" stroke="#7be4ff" stroke-width="1.5"></rect>
  <text x="94" y="392" font-size="17" fill="#eaf2ff">2</text>
  <text x="118" y="392" font-size="21" fill="#eaf2ff">mise activate pwsh</text>
  <text x="118" y="418" font-size="16" fill="#7be4ff" font-family="'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', system-ui, sans-serif">包む / wraps the prompt</text>
  <path d="M302 430V450" stroke="#7be4ff" stroke-width="3" fill="none"></path><path d="M296 450l6 12 6-12z" fill="#7be4ff"></path>

  <rect x="72" y="462" width="460" height="58" rx="6" fill="none" stroke="#9dff7b" stroke-width="1.5"></rect>
  <text x="94" y="488" font-size="16" fill="#9dff7b" font-family="'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', system-ui, sans-serif">毎回 hook-env → oh-my-posh の順</text>
  <text x="94" y="510" font-size="16" fill="#9dff7b">hook-env, then the oh-my-posh line</text>

  <path d="M600 190V520" stroke="rgba(160,200,255,0.18)" stroke-width="1"></path>

  <text x="668" y="206" font-size="22" fill="#ff6b8b" letter-spacing="2" font-family="'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', system-ui, sans-serif">壊れる順</text>
  <text x="782" y="206" font-size="18" fill="#eaf2ff" font-family="'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', system-ui, sans-serif">activate が先、init が後</text>
  <text x="668" y="232" font-size="18" fill="#eaf2ff">activate first, init second</text>

  <rect x="668" y="248" width="460" height="72" rx="6" fill="url(#chipR)" stroke="rgba(255,107,139,0.6)" stroke-width="1.5"></rect>
  <text x="690" y="282" font-size="17" fill="#eaf2ff">1</text>
  <text x="714" y="282" font-size="21" fill="#eaf2ff">mise activate pwsh</text>
  <text x="714" y="308" font-size="16" fill="#ff6b8b" font-family="'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', system-ui, sans-serif">古い prompt を包む / wraps the old one</text>
  <path d="M898 320V344" stroke="#ff6b8b" stroke-width="3" fill="none"></path><path d="M892 344l6 12 6-12z" fill="#ff6b8b"></path>

  <rect x="668" y="358" width="460" height="72" rx="6" fill="url(#chipR)" stroke="rgba(255,107,139,0.6)" stroke-width="1.5"></rect>
  <text x="690" y="392" font-size="17" fill="#eaf2ff">2</text>
  <text x="714" y="392" font-size="21" fill="#eaf2ff">oh-my-posh init pwsh</text>
  <text x="714" y="418" font-size="16" fill="#ff6b8b" font-family="'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', system-ui, sans-serif">ラッパーを上書き / overwrites it</text>
  <path d="M898 430V450" stroke="#ff6b8b" stroke-width="3" fill="none"></path><path d="M892 450l6 12 6-12z" fill="#ff6b8b"></path>

  <rect x="668" y="462" width="460" height="58" rx="6" fill="none" stroke="#ff6b8b" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.85"></rect>
  <text x="690" y="488" font-size="16" fill="#ff6b8b" font-family="'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', system-ui, sans-serif">hook-env は cd のときだけ</text>
  <text x="690" y="510" font-size="16" fill="#ff6b8b">mise hook-env: only on cd</text>
</svg>