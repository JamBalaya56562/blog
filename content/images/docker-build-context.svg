<rect x="696" y="112" width="488" height="572" rx="5" fill="#0a2542" stroke="rgba(53,224,189,0.5)" stroke-width="1.5"></rect>
<rect x="696" y="112" width="488" height="44" rx="5" fill="#0c3b34"></rect><text x="720" y="142" font-size="20" fill="#35e0bd" letter-spacing="2">linux vm / docker engine</text>
<text x="720" y="196" font-size="17" fill="#a9c6dd" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">届いたコンテキスト（203 B）</text>
<rect x="720" y="214" width="440" height="60" rx="4" fill="rgba(53,224,189,0.18)" stroke="#35e0bd"></rect>
<text x="744" y="252" font-size="21" fill="#eef6fc">Dockerfile</text>
<rect x="720" y="286" width="440" height="60" rx="4" fill="rgba(53,224,189,0.18)" stroke="#35e0bd"></rect>
<text x="744" y="324" font-size="21" fill="#eef6fc">index.html</text>
<text x="720" y="392" font-size="22" fill="#ffb04a" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif" font-weight="700">COPY はここからしか取れない</text>
<rect x="720" y="414" width="440" height="122" rx="4" fill="#061c33" stroke="rgba(140,205,255,0.28)"></rect>
<text x="744" y="450" font-size="18" fill="#35e0bd">COPY<tspan fill="#eef6fc"> index.html /usr/…</tspan></text>
<text x="744" y="482" font-size="18" fill="#ff7b6a">COPY<tspan fill="rgba(238,246,252,0.55)"> ../secrets .</tspan></text>
<text x="744" y="514" font-size="16" fill="#ff7b6a" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">← コンテキストの外は参照できない</text>
<text x="720" y="578" font-size="17" fill="#a9c6dd" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">エンジンはリモートにいることもある。</text>
<text x="720" y="604" font-size="17" fill="#a9c6dd" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">だから「手元のパス」ではなく</text>
<text x="720" y="630" font-size="17" fill="#a9c6dd" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">「送った中身」だけが材料になる</text>
<text x="720" y="666" font-size="17" fill="#5cc0ff">#6 transferring context: 203B</text>
