<text x="428" y="566" font-size="17" fill="#eef6fc" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">置き忘れると</text>
<text x="428" y="592" font-size="17" fill="#eef6fc" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">転送だけで</text>
<text x="428" y="618" font-size="17" fill="#ff7b6a" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif" font-weight="700">数分かかる</text>
