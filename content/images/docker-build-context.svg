<text x="64" y="318" font-size="16" fill="#a9c6dd">164 B</text>
<text x="344" y="304" font-size="22" fill="#35e0bd" text-anchor="end" font-weight="700">→</text>
<rect x="40" y="350" width="324" height="66" rx="4" fill="rgba(255,123,106,0.14)" stroke="#ff7b6a"></rect>
<rect x="40" y="350" width="5" height="66" fill="#ff7b6a"></rect>
<text x="64" y="380" font-size="21" fill="#eef6fc">node_modules/</text>
<text x="64" y="404" font-size="16" fill="#a9c6dd">412 MB</text>
