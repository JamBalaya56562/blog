<rect x="40" y="436" width="324" height="66" rx="4" fill="rgba(255,123,106,0.14)" stroke="#ff7b6a"></rect>
<rect x="40" y="436" width="5" height="66" fill="#ff7b6a"></rect>
<text x="64" y="466" font-size="21" fill="#eef6fc">.git/</text>
<text x="64" y="490" font-size="16" fill="#a9c6dd">88 MB</text>
<text x="344" y="476" font-size="22" fill="#ff7b6a" text-anchor="end" font-weight="700">✕</text>
<text x="40" y="558" font-size="18" fill="#ffb04a" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif" font-weight="700">docker build <tspan fill="#eef6fc">.</tspan> の「.」がこれ</text>
<text x="40" y="596" font-size="17" fill="#a9c6dd" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">このディレクトリ丸ごとが</text>
<text x="40" y="622" font-size="17" fill="#a9c6dd" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">コンテキストの候補になる</text>
<text x="40" y="660" font-size="17" fill="#eef6fc">500 MB → 203 B</text>
<rect x="404" y="112" width="232" height="572" rx="5" fill="#0a2542" stroke="#ff7b6a" stroke-width="1.5"></rect>
<rect x="404" y="112" width="232" height="44" rx="5" fill="#3a1c22"></rect><text x="428" y="142" font-size="20" fill="#ff7b6a" letter-spacing="2">.dockerignore</text>
<text x="428" y="196" font-size="19" fill="#ff7b6a">node_modules</text>
<text x="428" y="228" font-size="19" fill="#ff7b6a">.git</text>
<text x="428" y="260" font-size="19" fill="#ff7b6a">*.log</text>
