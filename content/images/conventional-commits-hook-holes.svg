<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#123832"></stop><stop offset="0.54" stop-color="#0d2430"></stop><stop offset="1" stop-color="#0a1824"></stop></linearGradient>
<radialGradient id="gG" cx="0.08" cy="0.04" r="0.72"><stop offset="0" stop-color="#4ade80" stop-opacity="0.15"></stop><stop offset="1" stop-color="#4ade80" stop-opacity="0"></stop></radialGradient>
<radialGradient id="gC" cx="0.94" cy="0.96" r="0.72"><stop offset="0" stop-color="#7be4ff" stop-opacity="0.13"></stop><stop offset="1" stop-color="#7be4ff" stop-opacity="0"></stop></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(150,255,215,0.055)" stroke-width="1"></path></pattern>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffb84d"></path></marker>
<marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4ade80"></path></marker>
<marker id="aC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7be4ff"></path></marker>
<marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff6b6b"></path></marker>
</defs>
<rect width="1200" height="600" fill="url(#bg)"></rect><rect width="1200" height="600" fill="url(#grid)"></rect>
<rect width="1200" height="600" fill="url(#gG)"></rect><rect width="1200" height="600" fill="url(#gC)"></rect>
<g fill="none"><rect x="28" y="28" width="1144" height="544" rx="10" stroke="rgba(120,220,180,0.22)"></rect><rect x="40" y="40" width="1120" height="520" rx="6" stroke="rgba(120,220,180,0.10)"></rect></g>
<rect x="56" y="50" width="10" height="10" fill="#4ade80"></rect>
<text x="78" y="60" font-size="15" fill="#4ade80" letter-spacing="4">conventional commits</text>
<text x="72" y="112" font-size="30" fill="#e8f4f1" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif" font-weight="700">フックには 2 つの抜け道がある。だから CI で受ける</text>
<text x="72" y="148" font-size="30" fill="#e8f4f1">Two ways past the hook — so CI is the real gate</text>
<path d="M72 164H1128" stroke="rgba(120,220,180,0.18)"></path><text x="72" y="196" font-size="17" fill="#ffb84d">commit-msg hook vs CI</text><rect x="72" y="254" width="322" height="52" rx="4" fill="rgba(232,244,241,0.07)" stroke="#4ade80" stroke-opacity="0.45"></rect><text x="233" y="287" font-size="19" fill="#e8f4f1" text-anchor="middle">git commit</text><path d="M394 280H470" stroke="#4ade80" stroke-width="2" marker-end="url(#aG)"></path><rect x="494" y="254" width="186" height="52" rx="4" fill="rgba(74,222,128,0.12)" stroke="#4ade80"></rect><text x="587" y="287" font-size="19" fill="#4ade80" text-anchor="middle">lefthook</text><text x="587" y="328" font-size="15" fill="rgba(232,244,241,0.55)" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif" text-anchor="middle">commit-msg フック</text><path d="M680 280H852" stroke="#4ade80" stroke-width="2" marker-end="url(#aG)"></path><rect x="72" y="342" width="322" height="52" rx="4" fill="rgba(232,244,241,0.07)" stroke="#ff6b6b" stroke-opacity="0.45"></rect><text x="233" y="375" font-size="17" fill="#e8f4f1" text-anchor="middle">git commit --no-verify</text><path d="M394 368H852" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#aR)"></path><text x="587" y="356" font-size="15" fill="#ff6b6b" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif" text-anchor="middle">フックを飛ばす</text><text x="587" y="392" font-size="15" fill="#ff6b6b" text-anchor="middle">skips the hook</text><rect x="72" y="430" width="322" height="52" rx="4" fill="rgba(232,244,241,0.07)" stroke="#ff6b6b" stroke-opacity="0.45"></rect><text x="233" y="463" font-size="19" fill="#e8f4f1" text-anchor="middle">jj commit</text><path d="M394 456H852" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#aR)"></path><text x="587" y="444" font-size="15" fill="#ff6b6b" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif" text-anchor="middle">Git フックを呼ばない</text><text x="587" y="480" font-size="15" fill="#ff6b6b" text-anchor="middle">never calls Git hooks</text><rect x="876" y="234" width="252" height="266" rx="8" fill="rgba(123,228,255,0.07)" stroke="#7be4ff"></rect><text x="1002" y="290" font-size="34" fill="#7be4ff" text-anchor="middle" font-weight="700">CI</text><text x="1002" y="336" font-size="18" fill="#e8f4f1" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif" text-anchor="middle">どの道も必ず通る</text><text x="1002" y="362" font-size="17" fill="rgba(232,244,241,0.55)" text-anchor="middle">every path goes</text><text x="1002" y="384" font-size="17" fill="rgba(232,244,241,0.55)" text-anchor="middle">through it</text><path d="M900 412H1104" stroke="rgba(123,228,255,0.3)"></path><text x="1002" y="444" font-size="19" fill="#7be4ff" text-anchor="middle">commitlint</text><text x="1002" y="472" font-size="15" fill="rgba(232,244,241,0.55)" text-anchor="middle">PR title + commits</text><text x="72" y="540" font-size="18" fill="#ffb84d" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">手元の検査は抜けられる。マージ前の検査は抜けられない</text><text x="72" y="566" font-size="18" fill="#ffb84d">a local check can be skipped; a merge check cannot</text></svg>