<rect width="1200" height="600" fill="url(#gG)"></rect><rect width="1200" height="600" fill="url(#gC)"></rect>
<g fill="none"><rect x="28" y="28" width="1144" height="544" rx="10" stroke="rgba(120,220,180,0.22)"></rect><rect x="40" y="40" width="1120" height="520" rx="6" stroke="rgba(120,220,180,0.10)"></rect></g>
<rect x="56" y="50" width="10" height="10" fill="#4ade80"></rect>
<text x="78" y="60" font-size="15" fill="#4ade80" letter-spacing="4">conventional commits</text>
<text x="72" y="112" font-size="30" fill="#e8f4f1" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif" font-weight="700">検査が走るのは、手元と CI の 2 か所</text>
<text x="72" y="148" font-size="30" fill="#e8f4f1">Where the check runs: on your machine, and in CI</text>
<path d="M72 164H1128" stroke="rgba(120,220,180,0.18)"></path><rect x="72" y="214" width="420" height="290" rx="8" fill="rgba(74,222,128,0.05)" stroke="rgba(74,222,128,0.35)"></rect><text x="96" y="196" font-size="17" fill="#4ade80">手元 / on your machine</text><rect x="112" y="250" width="340" height="52" rx="4" fill="rgba(232,244,241,0.07)" stroke="rgba(120,220,180,0.3)"></rect><text x="282" y="283" font-size="20" fill="#e8f4f1" text-anchor="middle">git commit</text><path d="M282 302V320" stroke="#4ade80" stroke-width="2" marker-end="url(#aG)"></path><rect x="112" y="326" width="340" height="52" rx="4" fill="rgba(232,244,241,0.07)" stroke="rgba(120,220,180,0.3)"></rect><text x="282" y="359" font-size="20" fill="#4ade80" text-anchor="middle">lefthook  commit-msg</text><path d="M282 378V396" stroke="#4ade80" stroke-width="2" marker-end="url(#aG)"></path><rect x="112" y="402" width="340" height="52" rx="4" fill="rgba(232,244,241,0.07)" stroke="rgba(120,220,180,0.3)"></rect><text x="282" y="435" font-size="20" fill="#4ade80" text-anchor="middle">commitlint</text><text x="96" y="486" font-size="16" fill="rgba(232,244,241,0.55)" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">push する前に気付くため / to catch it before you push</text><path d="M500 356H556" stroke="#ffb84d" stroke-width="2" marker-end="url(#aA)"></path><rect x="580" y="214" width="548" height="290" rx="8" fill="rgba(123,228,255,0.05)" stroke="rgba(123,228,255,0.35)"></rect><text x="604" y="196" font-size="17" fill="#7be4ff">CI / on the pull request</text><rect x="604" y="250" width="234" height="80" rx="4" fill="rgba(123,228,255,0.08)" stroke="rgba(123,228,255,0.35)"></rect><text x="721" y="282" font-size="19" fill="#e8f4f1" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif" text-anchor="middle">PR のタイトル</text><text x="721" y="308" font-size="16" fill="rgba(232,244,241,0.55)" text-anchor="middle">the PR title</text><path d="M721 330V358" stroke="#7be4ff" stroke-width="2" marker-end="url(#aC)"></path><rect x="862" y="250" width="234" height="80" rx="4" fill="rgba(123,228,255,0.08)" stroke="rgba(123,228,255,0.35)"></rect><text x="979" y="282" font-size="19" fill="#e8f4f1" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif" text-anchor="middle">PR の全コミット</text><text x="979" y="308" font-size="16" fill="rgba(232,244,241,0.55)" text-anchor="middle">every commit in the PR</text><path d="M979 330V358" stroke="#7be4ff" stroke-width="2" marker-end="url(#aC)"></path><rect x="604" y="366" width="492" height="52" rx="4" fill="rgba(232,244,241,0.07)" stroke="rgba(123,228,255,0.3)"></rect><text x="850" y="399" font-size="20" fill="#7be4ff" text-anchor="middle">commitlint</text><text x="604" y="458" font-size="16" fill="rgba(232,244,241,0.55)" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">守られていないものをマージさせないため</text><text x="604" y="486" font-size="16" fill="rgba(232,244,241,0.55)">to keep an unchecked message out of main</text><text x="72" y="540" font-size="18" fill="#ffb84d" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">フックと CI は、どちらかを選ぶものではない</text><text x="72" y="566" font-size="18" fill="#ffb84d">hooks and CI are not an either-or</text></svg>