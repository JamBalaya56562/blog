<text x="72" y="148" font-size="30" fill="#e8f4f1">One line: type, scope, summary</text>
<path d="M72 164H1128" stroke="rgba(120,220,180,0.18)"></path><text x="72" y="196" font-size="17" fill="#ffb84d">1 行目の形 / the header line</text><text x="72" y="246" font-size="28" xml:space="preserve"><tspan fill="#4ade80">feat</tspan><tspan fill="#7be4ff">(api)</tspan><tspan fill="#ff6b6b">!</tspan><tspan fill="rgba(232,244,241,0.55)">:</tspan><tspan fill="#e8f4f1"> drop the v1 endpoints</tspan></text><path d="M72 264H534" stroke="rgba(120,220,180,0.25)"></path><rect x="72" y="300" width="160" height="40" rx="4" fill="#4ade80"></rect><text x="152" y="327" font-size="20" fill="#06281a" text-anchor="middle" font-weight="700">feat</text><text x="252" y="327" font-size="20" fill="#4ade80">type</text><text x="400" y="327" font-size="20" fill="rgba(232,244,241,0.55)" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">変更の種類</text><rect x="72" y="358" width="160" height="40" rx="4" fill="#7be4ff"></rect><text x="152" y="385" font-size="20" fill="#052430" text-anchor="middle" font-weight="700">(api)</text><text x="252" y="385" font-size="20" fill="#7be4ff">scope</text><text x="400" y="385" font-size="20" fill="rgba(232,244,241,0.55)" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">変更した範囲</text><rect x="72" y="416" width="160" height="40" rx="4" fill="#ff6b6b"></rect><text x="152" y="443" font-size="20" fill="#2b0808" text-anchor="middle" font-weight="700">!</text><text x="252" y="443" font-size="20" fill="#ff6b6b">!</text><text x="400" y="443" font-size="20" fill="rgba(232,244,241,0.55)" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">破壊的変更の印</text><rect x="72" y="474" width="160" height="40" rx="4" fill="rgba(232,244,241,0.10)" stroke="rgba(232,244,241,0.35)"></rect><text x="152" y="501" font-size="20" fill="#e8f4f1" text-anchor="middle" font-weight="700">summary</text><text x="252" y="501" font-size="20" fill="#e8f4f1">summary</text><text x="400" y="501" font-size="20" fill="rgba(232,244,241,0.55)" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">何をしたか</text><text x="72" y="548" font-size="17" fill="#ffb84d" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">仕様が決めているのは feat と fix の 2 つだけ</text><text x="72" y="572" font-size="17" fill="#ffb84d">only feat and fix are in the specification</text><text x="690" y="196" font-size="17" fill="#ffb84d">メッセージ全体 / the whole message</text><rect x="690" y="214" width="438" height="286" rx="6" fill="rgba(255,184,77,0.05)" stroke="rgba(255,184,77,0.35)"></rect><text x="714" y="252" font-size="17" fill="#e8f4f1">&lt;type&gt;(&lt;scope&gt;)!: &lt;summary&gt;</text><text x="1104" y="252" font-size="14" fill="#ffb84d" text-anchor="end">header</text><text x="714" y="286" font-size="17" fill="rgba(232,244,241,0.38)">(blank)</text><text x="714" y="320" font-size="17" fill="#e8f4f1">&lt;body&gt;</text><text x="1104" y="320" font-size="14" fill="#ffb84d" text-anchor="end">body</text><text x="714" y="354" font-size="17" fill="rgba(232,244,241,0.38)">(blank)</text><text x="714" y="388" font-size="17" fill="#e8f4f1">BREAKING CHANGE: ...</text><text x="1104" y="388" font-size="14" fill="#ffb84d" text-anchor="end">footer</text><path d="M714 424H1104" stroke="rgba(255,184,77,0.25)"></path><text x="714" y="456" font-size="17" fill="#e8f4f1" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">必須なのは header だけ</text><text x="714" y="482" font-size="17" fill="rgba(232,244,241,0.55)">only the header is required</text></svg>