<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17456f"></stop><stop offset="1" stop-color="#0c2a48"></stop></linearGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="rgba(180,225,255,0.07)" stroke-width="1"></path></pattern>
<marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5cc0ff"></path></marker>
<marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#35e0bd"></path></marker>
<marker id="aY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffb04a"></path></marker>
<marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff7b6a"></path></marker>
</defs>
<rect width="1200" height="700" fill="url(#bg)"></rect><rect width="1200" height="700" fill="url(#grid)"></rect>
<rect x="0" y="0" width="1200" height="96" fill="#092039"></rect>
<rect x="0" y="0" width="14" height="96" fill="#ffb04a"></rect>
<text x="40" y="44" font-size="15" fill="#5cc0ff" letter-spacing="4">containers &amp; docker</text>
<text x="40" y="78" font-size="32" fill="#eef6fc" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif" font-weight="700">Dockerfile の 1 行が、1 枚のレイヤーになる</text>
<text x="1168" y="44" font-size="15" fill="rgba(169,198,221,0.8)" text-anchor="end">one line = one layer</text>
<rect x="0" y="96" width="1200" height="3" fill="#5cc0ff"></rect>
<rect x="16" y="112" width="430" height="572" rx="5" fill="#0a2542" stroke="rgba(140,205,255,0.3)" stroke-width="1.5"></rect>
<rect x="16" y="112" width="430" height="44" rx="5" fill="#123c66"></rect>
<text x="40" y="142" font-size="20" fill="#eef6fc" letter-spacing="2">Dockerfile</text>
<rect x="40" y="184" width="382" height="110" rx="4" fill="rgba(92,192,255,0.16)" stroke="#5cc0ff"></rect>
<text x="60" y="216" font-size="15" fill="#5cc0ff">[1/2]</text>
<text x="60" y="252" font-size="24" fill="#5cc0ff" font-weight="700">FROM<tspan fill="#eef6fc" font-weight="400"> nginx:1.29-alpine</tspan></text>
<text x="60" y="280" font-size="17" fill="#a9c6dd" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">土台のイメージを pull する → 8 枚</text>
<rect x="40" y="312" width="382" height="110" rx="4" fill="rgba(53,224,189,0.18)" stroke="#35e0bd"></rect>
<text x="60" y="344" font-size="15" fill="#35e0bd">[2/2]</text>
<text x="60" y="380" font-size="24" fill="#35e0bd" font-weight="700">COPY<tspan fill="#eef6fc" font-weight="400"> index.html …</tspan></text>
<text x="60" y="408" font-size="17" fill="#a9c6dd" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">手元の 1 枚を足す → 164 B</text>
<rect x="40" y="444" width="382" height="2" fill="rgba(140,205,255,0.25)"></rect>
<text x="60" y="486" font-size="19" fill="#ffb04a" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif" font-weight="700">2 行 = 2 ステップ = レイヤー 9 枚</text>
<text x="60" y="524" font-size="17" fill="#eef6fc" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">1 行増やすと、イメージに</text>
<text x="60" y="550" font-size="17" fill="#eef6fc" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">1 枚の差分が積まれる</text>
<text x="60" y="596" font-size="17" fill="#a9c6dd" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">変わっていない行のレイヤーは</text>
<text x="60" y="622" font-size="17" fill="#a9c6dd" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">次のビルドで再利用される</text>
<text x="60" y="660" font-size="18" fill="#35e0bd">→ #6 CACHED</text>
<path d="M458 398H498" stroke="#5cc0ff" stroke-width="2" marker-end="url(#aB)"></path>
<text x="478" y="380" font-size="15" fill="#5cc0ff" text-anchor="middle">build</text>
<rect x="510" y="112" width="560" height="572" rx="5" fill="#0a2542" stroke="rgba(140,205,255,0.3)" stroke-width="1.5"></rect>
<rect x="510" y="112" width="560" height="44" rx="5" fill="#123c66"></rect>
<text x="534" y="142" font-size="20" fill="#eef6fc" letter-spacing="2">mysite:latest</text>
<rect x="534" y="172" width="512" height="66" rx="4" fill="#35e0bd"></rect>
<text x="554" y="202" font-size="22" fill="#062b25" font-weight="700">COPY index.html</text>
<text x="554" y="226" font-size="16" fill="rgba(6,43,37,0.8)" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">新しく作られた 1 枚 — 24.6 kB</text>
<text x="1026" y="212" font-size="15" fill="#062b25" text-anchor="end" font-weight="700">NEW</text>
<rect x="534" y="250" width="512" height="46" rx="3" fill="rgba(92,192,255,0.3)" stroke="rgba(92,192,255,0.55)"></rect>
<text x="554" y="280" font-size="19" fill="#eef6fc">CMD nginx -g daemon off</text>
<text x="1026" y="279" font-size="14" fill="#9fd4ff" text-anchor="end">CACHED</text>
<rect x="534" y="300" width="512" height="46" rx="3" fill="rgba(92,192,255,0.27499999999999997)" stroke="rgba(92,192,255,0.55)"></rect>
<text x="554" y="330" font-size="19" fill="#eef6fc">entrypoint.d/*.sh</text>
<text x="1026" y="329" font-size="14" fill="#9fd4ff" text-anchor="end">CACHED</text>
<rect x="534" y="350" width="512" height="46" rx="3" fill="rgba(92,192,255,0.25)" stroke="rgba(92,192,255,0.55)"></rect>
<text x="554" y="380" font-size="19" fill="#eef6fc">docker-entrypoint.sh</text>
<text x="1026" y="379" font-size="14" fill="#9fd4ff" text-anchor="end">CACHED</text>
<rect x="534" y="400" width="512" height="46" rx="3" fill="rgba(92,192,255,0.22499999999999998)" stroke="rgba(92,192,255,0.55)"></rect>
<text x="554" y="430" font-size="19" fill="#eef6fc">conf.d/default.conf</text>
<text x="1026" y="429" font-size="14" fill="#9fd4ff" text-anchor="end">CACHED</text>
<rect x="534" y="450" width="512" height="46" rx="3" fill="rgba(92,192,255,0.19999999999999998)" stroke="rgba(92,192,255,0.55)"></rect>
<text x="554" y="480" font-size="19" fill="#eef6fc">nginx.conf</text>
<text x="1026" y="479" font-size="14" fill="#9fd4ff" text-anchor="end">CACHED</text>
<rect x="534" y="500" width="512" height="46" rx="3" fill="rgba(92,192,255,0.175)" stroke="rgba(92,192,255,0.55)"></rect>
<text x="554" y="530" font-size="19" fill="#eef6fc">nginx 1.29 binary</text>
<text x="1026" y="529" font-size="14" fill="#9fd4ff" text-anchor="end">CACHED</text>
<rect x="534" y="550" width="512" height="46" rx="3" fill="rgba(92,192,255,0.14999999999999997)" stroke="rgba(92,192,255,0.55)"></rect>
<text x="554" y="580" font-size="19" fill="#eef6fc">ca-certificates</text>
<text x="1026" y="579" font-size="14" fill="#9fd4ff" text-anchor="end">CACHED</text>
<rect x="534" y="600" width="512" height="46" rx="3" fill="rgba(92,192,255,0.12499999999999997)" stroke="rgba(92,192,255,0.55)"></rect>
<text x="554" y="630" font-size="19" fill="#eef6fc">alpine 3.22 rootfs</text>
<text x="1026" y="629" font-size="14" fill="#9fd4ff" text-anchor="end">CACHED</text>
<text x="534" y="672" font-size="16" fill="#9fd4ff" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif">↑ nginx:1.29-alpine が持ってきた 8 枚（読み取り専用）</text>
<path d="M1096 172H1116V678H1096" fill="none" stroke="#ffb04a" stroke-width="2"></path>
<text x="1140" y="425" font-size="19" fill="#ffb04a" font-weight="700" transform="rotate(90 1140 425)" text-anchor="middle">image = 9 layers</text>
