[global]
flavor = "mdx"
respect-gitignore = true
disable = ["MD057"]
exclude = [
    ".github/pull_request_template.md",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "README.md",
]

[per-file-ignores]
"content/posts/ja/**/*.mdx" = ["MD013"]

[MD013]
line-length = 120
# Command output and commands quoted in fences are shown as they are; wrapping
# them would change what the reader has to compare against their terminal.
code-blocks = false
