name: 🚀 Build and Deploy to AWS Lambda

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: main
    paths:
      - "app/**"
      - "components/**"
      - "content/**"
      - "lib/**"
      - "public/**"
      - "test/**"
      - ".dockerignore"
      - "bun.lock"
      - "Dockerfile"
      - "package.json"
      - "*config.*"
  workflow_dispatch:
    inputs:
      no-cache:
        description: "Build docker images with no cache"
        default: false
        required: false
        type: boolean

permissions:
  id-token: write

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: ${{ github.event.repository.name }}
  LAMBDA_FUNCTION_NAME: ${{ github.event.repository.name }}

jobs:
  lambda:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.repository_owner == 'jambalaya56562'

    steps:
    - name: 🪪 Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: 🌳 Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: 🔖 Get an old ImageTag
      run: |
        echo "OLD_IMAGE_TAG=$(aws ecr list-images --repository-name $ECR_REPOSITORY \
        --query 'imageIds[0].imageTag' --output text)" >> $GITHUB_ENV

    - name: 🐦‍⬛ Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: 🛠️ Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: 🚀 Build and Push
      uses: docker/build-push-action@v7
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      with:
        cache-from: type=gha
        cache-to: type=gha,mode=max
        no-cache: ${{ inputs.no-cache == true }}
        platforms: linux/arm64
        provenance: false
        push: true
        tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        build-args: |
          CONTENT_SOURCE=github
          GITHUB_REPO=${{ github.event.repository.name }}
        secret-envs: |
          DATABASE_URL=DATABASE_URL

    - name: 🥩 Deploy Lambda function with container image
      uses: aws-actions/aws-lambda-deploy@d496277188b89f0be02d7a2216fc912c0427702a
      with:
        function-name: ${{ env.LAMBDA_FUNCTION_NAME }}
        package-type: Image
        image-uri: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        architectures: arm64

    - name: 🗑️ Delete an old Image
      run: |
        aws ecr batch-delete-image --repository-name $ECR_REPOSITORY \
        --image-ids imageTag=$OLD_IMAGE_TAG
