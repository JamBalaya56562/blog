name: 🚜 OpenTofu Apply

# The state is a single artifact with no lock behind it, so two applies running
# at once would each write a state that does not know about the other. Queued,
# never cancelled.
concurrency:
  group: tofu-state
  cancel-in-progress: false

on:
  push:
    branches: main
    paths:
      - "infra/**"
      - ".github/workflows/tofu-apply.yml"
      - ".github/scripts/fetch-tofu-state.sh"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Apply with no state, building the stack from nothing. Only after a deliberate `tofu destroy` — against a live account it builds a second copy.
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  # Read the previous state artifact and write the new one.
  actions: write

env:
  AWS_REGION: ap-northeast-1

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.repository_owner == 'jambalaya56562'
    environment: tofu-apply

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 🪪 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TOFU_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🐣 Setup mise
        uses: jdx/mise-action@v4.3.0

      # See the script for what a state has to come from to be taken. With none
      # found the apply stops: an empty state would plan every resource as new
      # and build a second copy of the account — including a second hosted zone
      # for the same domain, which nothing would refuse. The one legitimate
      # reason to apply from nothing, rebuilding after a deliberate destroy, is
      # a dispatch with `bootstrap` ticked.
      - name: 📦 Fetch the current state
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/fetch-tofu-state.sh infra

      - name: 🛑 Refuse to apply without a state
        if: steps.state.outputs.found != 'true'
        env:
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: |
          if [ "$BOOTSTRAP" = "true" ]; then
            echo "::warning::No state found; applying from nothing because bootstrap was requested."
            exit 0
          fi
          echo "::error::No trusted tofu-state artifact found. Refusing to apply against an empty state. If the stack was destroyed on purpose, run this workflow by hand with bootstrap ticked."
          exit 1

      - name: 🚜 Apply
        working-directory: infra
        run: |
          tofu init -input=false
          tofu apply -input=false -auto-approve -no-color

      # Uploaded whether or not the apply succeeded. A half-applied run still
      # changed the account, and losing the state that records it is worse than
      # keeping a state that is mid-flight.
      - name: 💾 Store the state
        if: always() && hashFiles('infra/terraform.tfstate') != ''
        uses: actions/upload-artifact@v7
        with:
          name: tofu-state
          path: infra/terraform.tfstate
          retention-days: 90
          overwrite: true
          if-no-files-found: error
