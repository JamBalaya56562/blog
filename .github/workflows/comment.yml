name: 💬 Comment on the pull request

on:
  workflow_run:
    workflows:
      - 🧪 Test
    types:
      - completed

permissions:
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure')

    steps:
      - name: 📥 Download artifact
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          name: comment
          run-id: ${{ github.event.workflow_run.id }}
      - name: 💬 Add a comment
        uses: actions/github-script@v9
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        with:
          script: |
            const fs = require('fs')

            const { data: associated } =
              await github.rest.repos.listPullRequestsAssociatedWithCommit({
                commit_sha: process.env.HEAD_SHA,
                owner: context.repo.owner,
                repo: context.repo.repo,
              })
            const pullRequest =
              associated.find((pr) => pr.state === 'open') ?? associated[0]
            if (!pullRequest) { return }

            const body = fs.readFileSync('comment.txt', 'utf8')
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: pullRequest.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            })
            const previous = comments.find(
              (comment) =>
                comment.user.type === 'Bot' &&
                comment.body.includes(process.env.WORKFLOW_NAME),
            )
            if (!previous && process.env.CONCLUSION !== 'failure') { return }

            if (previous) {
              await github.rest.issues.updateComment({
                body,
                comment_id: previous.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
              })
              return
            }
            await github.rest.issues.createComment({
              body,
              issue_number: pullRequest.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            })
