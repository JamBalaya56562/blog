name: 🌱 OpenTofu Plan

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/tofu-*.yml"
      - ".github/scripts/fetch-tofu-state.sh"

permissions:
  contents: read
  id-token: write
  actions: read
  pull-requests: write

env:
  AWS_REGION: ap-northeast-1

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository_owner == 'jambalaya56562'

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 🪪 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TOFU_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🐣 Setup mise
        uses: jdx/mise-action@v4.3.0

      - name: 📦 Fetch the current state
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/fetch-tofu-state.sh infra

      - name: 🛑 Refuse to plan without a state
        if: steps.state.outputs.found != 'true'
        run: |
          echo "::error::No trusted tofu-state artifact found; a plan against an empty state would describe a different account."
          exit 1

      - name: 🧭 Plan
        id: plan
        working-directory: infra
        run: |
          tofu init -input=false
          set +e
          tofu plan -input=false -no-color -lock=false > plan.txt 2>&1
          code=$?
          set -e
          tail -c 60000 plan.txt
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit $code

      - name: 💬 Comment the plan on the pull request
        if: always() && steps.plan.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAN_EXIT: ${{ steps.plan.outputs.exit_code }}
        run: |
          if [ "$PLAN_EXIT" != "0" ]; then
            summary="Plan failed — see the output"
          else
            summary=$(grep -E '^(Plan:|No changes\.)' infra/plan.txt | tail -1 || true)
            if [ -z "$summary" ] && grep -q '^Changes to Outputs:' infra/plan.txt; then
              summary="Only outputs change — see the output"
            fi
            if [ -z "$summary" ]; then
              summary="Plan succeeded — see the output"
            fi
          fi
          {
            echo "<!-- tofu-plan -->"
            echo "### 🌱 OpenTofu Plan"
            echo
            echo "<details><summary><code>${summary}</code></summary>"
            echo
            echo '```'
            tail -c 60000 infra/plan.txt
            echo '```'
            echo
            echo "</details>"
          } > comment.md

          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- tofu-plan -->"))] | last | .id // empty')
          if [ -n "$id" ]; then
            jq -Rs '{body: .}' comment.md \
              | gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" --input - > /dev/null
            echo "Updated comment ${id}."
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md
          fi
