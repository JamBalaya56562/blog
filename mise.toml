[tools]
bun = "latest"
opentofu = "latest"
pitchfork = "latest"
rumdl = "latest"

# Not the registry's `ffmpeg`, which resolves to conda and spends nine minutes
# unpacking a dependency tree that includes tzdata. This is BtbN's prebuilt
# Windows binary: one archive, under two minutes, and it carries libwebp_anim,
# which is the encoder the thumbnails need.
#
# Pinned rather than `latest` because these are dated master builds, not
# releases — `latest` would mean a fresh multi-hundred-megabyte download
# whenever BtbN publishes, which is most days.
"github:BtbN/FFmpeg-Builds" = { version = "autobuild-2026-09-08-23-15", exe = "ffmpeg" }

[tasks.lint]
run = ["bun lint:fix --unsafe", "mise lint:md", "mise lint:tf"]

[tasks."lint:tf"]
description = "Format the OpenTofu configuration"
run = "tofu fmt -recursive infra"

[tasks."lint:md"]
description = "Check markdown files for linting issues"
run = "rumdl check --fix ."

[tasks.update]
description = "Update bun dependencies and reinstall"
run = ["bun update", "mise deps"]

[tasks."db:env"]
description = "Generate .env file with default development values"
run = "bun run scripts/setup-env.ts"

[tasks."db:start"]
description = "Start DynamoDB Local container for local development"
run = "bash scripts/db-start.sh"

[tasks."db:health"]
description = "Wait for DynamoDB Local to be healthy"
run = "bash scripts/db-health.sh"

[tasks."db:stop"]
description = "Stop DynamoDB Local container"
run = "bash scripts/db-stop.sh"

[tasks.thumbnail]
description = "Encode a thumbnail PNG as AVIF: mise run thumbnail <png> <slug>"
run = "bash scripts/thumbnail.sh"

[tasks."db:push"]
description = "Create the DynamoDB table if it does not exist"
run = "bun run scripts/db-push.ts"

[tasks."db:scan"]
description = "Dump every page view row as JSON"
run = "bun run scripts/db-scan.ts"

[tasks."db:setup"]
description = "Full local DB setup: generate .env, start DynamoDB Local, health check, create table"
depends = ["db:env", "db:start"]
run = ["mise run db:health", "mise run db:push"]

[deps.bun]
auto = true

[hooks]
enter = ["mise upgrade -q", "mise deps -q"]

[settings]
experimental = true
