[tools]
bun = "latest"
opentofu = "latest"
pitchfork = "latest"
rumdl = "latest"
"github:BtbN/FFmpeg-Builds" = { version = "autobuild-2026-09-08-23-15", exe = "ffmpeg" }

[env]
AWS_REGION = "ap-northeast-1"
DYNAMODB_ENDPOINT = "{{ env.DYNAMODB_ENDPOINT | default(value='http://localhost:8000') }}"
DYNAMODB_TABLE_NAME = "blog-page-views"

[tasks.lint]
# The fixers run first and the check last: `lint:emphasis` reports rather than
# repairs, and aborting the list early would leave the remaining fixes unapplied
# in autofix.ci, which commits whatever the fixers produced even on failure.
run = [
  "bun lint:fix --unsafe",
  "mise lint:md",
  "mise lint:tf",
  "mise lint:emphasis",
]

[tasks."lint:tf"]
description = "Format the OpenTofu configuration"
run = "tofu fmt -recursive infra"

[tasks."lint:md"]
description = "Check markdown files for linting issues"
run = "rumdl check --fix ."

[tasks.update]
description = "Update bun dependencies and reinstall"
run = ["bun update", "mise deps"]

[tasks."db:setup"]
description = "Start DynamoDB Local in the background and create the table"
run = "pitchfork start db"

[deps.bun]
auto = true

[hooks]
enter = ["mise upgrade -q", "mise deps -q"]

[settings]
experimental = true
