[tools]
bun = "latest"
opentofu = "latest"
pitchfork = "latest"
rumdl = "latest"

# Not the registry's `ffmpeg`, which resolves to conda and spends nine minutes
# unpacking a dependency tree that includes tzdata. This is BtbN's prebuilt
# Windows binary: one archive, under two minutes, and it carries libwebp_anim,
# which is the encoder the thumbnails need.
#
# Pinned rather than `latest` because these are dated master builds, not
# releases — `latest` would mean a fresh multi-hundred-megabyte download
# whenever BtbN publishes, which is most days.
"github:BtbN/FFmpeg-Builds" = { version = "autobuild-2026-09-08-23-15", exe = "ffmpeg" }

# Development defaults for the local DynamoDB container, replacing the generated
# `.env`. mise is activated in the shell, so these reach a bare `bun dev` and a
# hand-run `mise run db:push` alike, and the values are dev-only defaults rather
# than anything worth keeping out of the repository — no AWS credentials are
# involved either locally or on Lambda.
#
# The endpoint is one value rather than a host and a port assembled here. A
# derived value is only as good as the order it is derived in: `mise.local.toml`
# is merged after this file, so a port overridden there would land after the
# endpoint had already been rendered from the old one, pointing the clients at
# 8000 while the container published 9000. `db:start` reads the port back out of
# the endpoint instead, which cannot disagree with it.
#
# Each value keeps its own default, so `DYNAMODB_ENDPOINT=... bun dev` works for
# one command and `mise.local.toml` overrides it for one machine.
[env]
AWS_REGION = "ap-northeast-1"
DYNAMODB_ENDPOINT = "{{ env.DYNAMODB_ENDPOINT | default(value='http://localhost:8000') }}"
DYNAMODB_TABLE_NAME = "blog-page-views"

[tasks.lint]
# The fixers run first and the check last: `lint:emphasis` reports rather than
# repairs, and aborting the list early would leave the remaining fixes unapplied
# in autofix.ci, which commits whatever the fixers produced even on failure.
run = [
  "bun lint:fix --unsafe",
  "mise lint:md",
  "mise lint:tf",
  "mise lint:emphasis",
]

[tasks."lint:emphasis"]
description = "Fail on emphasis markers that never became emphasis"
run = "bun run scripts/lint-emphasis.ts"

[tasks."lint:tf"]
description = "Format the OpenTofu configuration"
run = "tofu fmt -recursive infra"

[tasks."lint:md"]
description = "Check markdown files for linting issues"
run = "rumdl check --fix ."

[tasks.update]
description = "Update bun dependencies and reinstall"
run = ["bun update", "mise deps"]

[tasks."db:push"]
description = "Create the DynamoDB table if it does not exist"
run = "bun run scripts/db-push.ts"

[tasks."db:scan"]
description = "Dump every page view row as JSON"
run = "bun run scripts/db-scan.ts"

[tasks."db:setup"]
# db:start runs in the foreground and never returns, so it cannot be a step in a
# list of them. Backgrounding belongs to the supervisor: `pitchfork start db`
# runs that same task as a daemon and returns once its readiness check — which
# is `db:push` — has created the table.
description = "Start DynamoDB Local in the background and create the table"
run = "pitchfork start db"

[deps.bun]
auto = true

[hooks]
enter = ["mise upgrade -q", "mise deps -q"]

[settings]
experimental = true
