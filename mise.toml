[tools]
bun = "latest"
opentofu = "latest"
pitchfork = "latest"
rumdl = "latest"
"github:BtbN/FFmpeg-Builds" = { version = "autobuild-2026-09-17-13-19", exe = "ffmpeg" }

[env]
AWS_REGION = "ap-northeast-1"
DYNAMODB_ENDPOINT = "{{ env.DYNAMODB_ENDPOINT | default(value='http://127.0.0.1:8000') }}"
DYNAMODB_TABLE_NAME = "blog-page-views"

[tasks.lint]
run = [
  "bun lint:fix --unsafe",
  "mise lint:md",
  "mise lint:tf",
  "mise lint:emphasis",
]

[tasks."lint:tf"]
description = "Format the OpenTofu configuration"
run = "tofu fmt -recursive infra"

[tasks."lint:md"]
description = "Check markdown files for linting issues"
run = "rumdl check --fix ."

[tasks.e2e]
description = "Build, then run the E2E tests with the database up"
daemons = ["db"]
run = ["bun run build", "bun test:e2e"]

[tasks.update]
description = "Update bun dependencies and reinstall"
run = ["bun update", "mise deps"]

[daemons.db]
task = "db:start"
ready_cmd = { run = "mise run db:push", timeout = "300s" }
stop_signal = { signal = "SIGTERM", timeout = "30s" }

[daemons.dev]
run = "bun dev"
depends = ["db"]
ready_port = { port = 3000, timeout = "60s" }

[deps.bun]
auto = true

[hooks]
enter = ["mise deps -q"]

[settings]
# `[daemons]` is one of the sections gated behind this.
experimental = true
