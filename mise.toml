[tools]
bun = "latest"
pitchfork = "latest"
rumdl = "latest"

[tasks.lint]
run = ["bun lint:fix --unsafe", "mise lint:md"]

[tasks."lint:md"]
description = "Check markdown files for linting issues"
run = "rumdl check --fix ."

[tasks.update]
description = "Update bun dependencies and reinstall"
run = ["bun update", "mise deps"]

[tasks."db:env"]
description = "Generate .env file with default development values"
run = "bun run scripts/setup-env.ts"

[tasks."db:start"]
description = "Start DynamoDB Local container for local development"
run = "bash scripts/db-start.sh"

[tasks."db:health"]
description = "Wait for DynamoDB Local to be healthy"
run = "bash scripts/db-health.sh"

[tasks."db:stop"]
description = "Stop DynamoDB Local container"
run = "bash scripts/db-stop.sh"

[tasks."db:push"]
description = "Create the DynamoDB table if it does not exist"
run = "bun run scripts/db-push.ts"

[tasks."db:scan"]
description = "Dump every page view row as JSON"
run = "bun run scripts/db-scan.ts"

[tasks."db:setup"]
description = "Full local DB setup: generate .env, start DynamoDB Local, health check, create table"
depends = ["db:env", "db:start"]
run = ["mise run db:health", "mise run db:push"]

[deps.bun]
auto = true

[hooks]
enter = ["mise upgrade -q", "mise deps -q"]

[settings]
experimental = true
