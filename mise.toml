[tools]
bun = "latest"
opentofu = "latest"
pitchfork = "latest"
rumdl = "latest"
"github:BtbN/FFmpeg-Builds" = { version = "autobuild-2026-09-08-23-15", exe = "ffmpeg" }

[env]
AWS_REGION = "ap-northeast-1"
DYNAMODB_ENDPOINT = "{{ env.DYNAMODB_ENDPOINT | default(value='http://127.0.0.1:8000') }}"
DYNAMODB_TABLE_NAME = "blog-page-views"

[tasks.lint]
# The fixers run first and the check last: `lint:emphasis` reports rather than
# repairs, and aborting the list early would leave the remaining fixes unapplied
# in autofix.ci, which commits whatever the fixers produced even on failure.
run = [
  "bun lint:fix --unsafe",
  "mise lint:md",
  "mise lint:tf",
  "mise lint:emphasis",
]

[tasks."lint:tf"]
description = "Format the OpenTofu configuration"
run = "tofu fmt -recursive infra"

[tasks."lint:md"]
description = "Check markdown files for linting issues"
run = "rumdl check --fix ."

[tasks.update]
description = "Update bun dependencies and reinstall"
run = ["bun update", "mise deps"]

[tasks."db:setup"]
description = "Start DynamoDB Local in the background and create the table"
run = "mise daemons start db"

# mise renders these into a pitchfork config under its state directory and
# registers it, so pitchfork stays the supervisor and has to remain in [tools] —
# the shell hooks that read this section never install tools themselves.
# Starting is left explicit rather than `auto = ["start", "stop"]`: entering the
# repository to read code should not bring a container and a server up.
[daemons.db]
run = "mise run db:start"
ready_cmd = { run = "mise run db:push", timeout = "300s" }
stop_signal = { signal = "SIGTERM", timeout = "30s" }

[daemons.dev]
run = "bun dev"
depends = ["db"]
ready_port = { port = 3000, timeout = "60s" }

[deps.bun]
auto = true

[hooks]
enter = ["mise upgrade -q", "mise deps -q"]

[settings]
# `[daemons]` is one of the sections gated behind this.
experimental = true
